name: Deploy static site to GitHub Pages

# Builds the frontend in static mode (no API; one HTML file per page plus
# sitemap.xml and robots.txt; see deploy/github-pages/.env.ghpages and
# docs/github-pages.md) and publishes it to https://serenovatech.github.io/
# with the official GitHub Pages actions.

on:
  push:
    branches:
      - main
  # Pull requests run lint, tests and the build as a check, but never deploy.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
# Pull-request checks use their own group so they never displace a deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build:pages

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
